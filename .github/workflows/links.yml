# Weekly link check for the live site. Many post links were recovered
# from the Wayback Machine and point at pages that no longer exist.
# Runs Mondays 09:00 UTC and on demand. Reports only — it never
# changes the site.
name: Check links
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Check links on the live site
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --timeout 30 --max-retries 2 --accept 200,201,202,203,204,206,301,302,303,307,308,429 https://jonathanmccallum.com
